name: Flutter mobile
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: ./tool/generate_api.sh --check
      - run: dart analyze
        working-directory: packages/healthys_api
      - run: dart test
        working-directory: packages/healthys_api
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: python3 -m unittest discover -s tool/tests -v
      - run: flutter build bundle --target-platform=linux-x64 --dart-define-from-file=config/dev.json
      - run: flutter build bundle --target-platform=linux-x64 --dart-define-from-file=config/prod.example.json
      - run: flutter build apk --debug --dart-define-from-file=config/dev.json
      - name: Create disposable CI signing key (never for distribution)
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-upload.jks" -alias ci -storepass ci-only-password -keypass ci-only-password -dname "CN=HEALTHYS CI ONLY" -keyalg RSA -keysize 2048 -validity 1
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/ci-upload.jks
          storePassword=ci-only-password
          keyAlias=ci
          keyPassword=ci-only-password
          EOF
      - name: Compile production AAB (test configuration and disposable key)
        run: flutter build appbundle --release --dart-define-from-file=config/prod.example.json
      - name: Remove disposable signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/ci-upload.jks"
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Compile iOS release without signing (not distributable)
        run: flutter build ios --release --no-codesign --dart-define-from-file=config/prod.example.json
