name: Resolve call dependencies
on:
  pull_request:
  push:
    branches: ['feature/**']
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: |
          echo HEALTHYS_LOCK_START
          cat pubspec.lock
          echo HEALTHYS_LOCK_END
